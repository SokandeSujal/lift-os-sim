<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift Policy Race — FCFS vs Nearest</title>
<style>
:root{--ink:#ebe5d5;--muted:#9d978a;--graphite:#121413;--panel:#1b1e1c;--panel2:#242824;--brass:#c9a75d;--brass2:#806a37;--green:#70b88a;--amber:#dfa64f;--red:#d76755;--line:#3c413b;--shadow:#070807}
@media(prefers-color-scheme:light){:root{--ink:#272a27;--muted:#696c66;--graphite:#e9e5da;--panel:#f6f2e7;--panel2:#ded8ca;--line:#bbb3a1;--shadow:#918b7d}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#3b392f 0,transparent 35%),repeating-linear-gradient(90deg,transparent 0 79px,#ffffff05 80px),var(--graphite);color:var(--ink);font-family:Georgia,"Times New Roman",serif;min-height:100vh}.shell{width:min(1500px,96vw);margin:auto;padding:28px 0 60px}header{display:grid;grid-template-columns:1fr auto;align-items:end;border-bottom:1px solid var(--brass2);padding-bottom:18px;margin-bottom:22px}h1{font-size:clamp(30px,4vw,62px);font-weight:400;letter-spacing:-.04em;margin:0}h1 span{color:var(--brass);font-style:italic}.kicker,.clock,.controls,.stats,.banner,.floor-label,.car{font-family:"Trebuchet MS","Segoe UI",sans-serif}.kicker{text-transform:uppercase;letter-spacing:.28em;color:var(--brass);font-size:11px}.clock{text-align:right}.clock strong{display:block;font-size:34px;font-variant-numeric:tabular-nums}.race{display:grid;grid-template-columns:1fr 1fr;gap:18px}.building{background:linear-gradient(145deg,var(--panel),#141715);border:1px solid var(--line);box-shadow:0 24px 60px var(--shadow);padding:18px;position:relative;overflow:hidden}.building:before{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#fff3 50%,transparent 70%);transform:translateX(-120%);animation:sheen 1.2s .2s both;pointer-events:none}@keyframes sheen{to{transform:translateX(120%)}}.policy-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}.policy-head h2{margin:0;font-weight:400;font-size:24px}.badge{border:1px solid var(--brass2);color:var(--brass);padding:5px 9px;font:10px "Trebuchet MS";letter-spacing:.16em;text-transform:uppercase}.building-grid{height:560px;display:grid;grid-template-columns:116px 1fr;position:relative}.queues{position:relative;border-right:1px solid var(--line)}.floor-queue{position:absolute;left:0;right:8px;height:calc(100% / var(--floors));display:flex;align-items:center;gap:3px}.floor-label{width:28px;color:var(--muted);font-size:10px}.person{width:8px;height:8px;border-radius:50% 50% 42% 42%;background:var(--green);position:relative;transition:.25s}.person:after{content:"";position:absolute;width:4px;height:6px;background:inherit;left:2px;top:7px;border-radius:2px}.person.amber{background:var(--amber)}.person.red{background:var(--red);animation:pulse 1s infinite}@keyframes pulse{50%{filter:brightness(1.5)}}.shafts{position:relative;display:grid;grid-template-columns:repeat(var(--lifts),1fr);gap:10px;padding:0 12px;background:repeating-linear-gradient(to top,transparent 0 calc(100% / var(--floors) - 1px),var(--line) calc(100% / var(--floors)))}.shaft{position:relative;border-left:1px solid #ffffff10;border-right:1px solid #0008;background:linear-gradient(90deg,#0004,#fff05,#0005)}.car{position:absolute;left:7%;width:86%;height:calc(100% / var(--floors) - 4px);bottom:calc(var(--floor) * 100% / var(--floors) + 2px);background:linear-gradient(135deg,#3a3e39,#20231f);border:1px solid var(--brass);box-shadow:0 5px 16px #000b;transition:bottom var(--duration) linear;border-radius:3px;display:grid;grid-template-rows:auto 1fr;overflow:hidden}.car-top{display:flex;justify-content:space-between;background:#0d0f0e;color:var(--brass);font-size:9px;padding:2px 4px}.doors{display:grid;grid-template-columns:1fr 1fr;gap:1px;padding:2px 5px;background:#111}.door{background:linear-gradient(90deg,#777,#444);transition:transform .2s}.car.serving .door:first-child{transform:translateX(-75%)}.car.serving .door:last-child{transform:translateX(75%)}.dots{position:absolute;left:50%;bottom:4px;transform:translateX(-50%);display:flex;gap:2px}.rider{width:5px;height:5px;border-radius:50%;background:var(--brass)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;margin-top:14px;background:var(--line)}.stat{background:var(--panel2);padding:9px 6px}.stat b{display:block;color:var(--brass);font-size:15px}.stat small{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em}.chart-wrap{margin-top:18px;background:var(--panel);border:1px solid var(--line);padding:14px}canvas{width:100%;height:150px}.legend{display:flex;gap:20px;font:11px "Trebuchet MS";color:var(--muted)}.legend i{display:inline-block;width:18px;height:2px;margin-right:6px;background:var(--brass)}.legend i.near{background:var(--green)}.controls{position:sticky;bottom:12px;margin:18px auto 0;background:#101210ee;border:1px solid var(--brass2);padding:12px;display:flex;align-items:center;gap:10px;box-shadow:0 15px 35px #0008;z-index:9}.controls button,.controls select{background:var(--panel2);color:var(--ink);border:1px solid var(--line);padding:8px 12px;cursor:pointer}.controls button:hover{border-color:var(--brass)}input[type=range]{flex:1;accent-color:var(--brass)}.banner{margin-top:18px;border:1px solid var(--brass);padding:18px;background:linear-gradient(90deg,#c9a75d18,transparent);font-size:18px}.missing{text-align:center;padding:80px 20px;border:1px solid var(--red);background:#d7675511}.hidden{display:none}@media(max-width:900px){.race{grid-template-columns:1fr}.building-grid{height:480px}.stats{grid-template-columns:repeat(3,1fr)}header{grid-template-columns:1fr}.clock{text-align:left;margin-top:10px}}
</style></head>
<body><main class="shell"><header><div><div class="kicker">Operating Systems Laboratory · Live Scheduler Study</div><h1>The <span>Lift Policy</span> Race</h1></div><div class="clock"><small class="kicker">Synchronized clock</small><strong>T<span id="tick">0</span></strong></div></header>
<div id="missing" class="missing hidden"><h2>Run data is missing</h2><p>From the project folder run <code>./run.sh compare</code>, then reopen this file.</p></div>
<section id="app"><div class="race" id="race"></div><div class="chart-wrap"><div class="legend"><span><i></i>FCFS waiting</span><span><i class="near"></i>Nearest waiting</span></div><canvas id="chart" width="1200" height="150"></canvas></div><div id="banner" class="banner hidden"></div><div class="controls"><button id="restart">↺ Restart</button><button id="back">←</button><button id="play">Pause</button><button id="forward">→</button><input id="scrub" type="range" min="0" value="0"><select id="speed"><option value=".5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></div></section></main>
<script src="../out/run_fcfs.js"></script><script src="../out/run_nearest.js"></script>
<script>
(()=>{const runs=window.LIFT_RUNS;if(!runs?.fcfs||!runs?.nearest){missing.classList.remove('hidden');app.classList.add('hidden');return}const maxTick=Math.max(runs.fcfs.frames.length,runs.nearest.frames.length)-1;let tick=0,playing=true,speed=1,last=performance.now();scrub.max=maxTick;
const waitAt=(r,t)=>r.passengers.filter(p=>p.arr<=t&&(p.board<0||p.board>t));const deliveredAt=(r,t)=>r.passengers.filter(p=>p.deliver>=0&&p.deliver<=t).length;
function building(key,label,tag){const r=runs[key],el=document.createElement('article');el.className='building';el.dataset.key=key;el.style.setProperty('--floors',r.meta.floors);el.style.setProperty('--lifts',r.meta.lifts);el.innerHTML=`<div class="policy-head"><h2>${label}</h2><span class="badge">${tag}</span></div><div class="building-grid"><div class="queues"></div><div class="shafts"></div></div><div class="stats"></div>`;const q=el.querySelector('.queues');for(let f=r.meta.floors-1;f>=0;f--){const row=document.createElement('div');row.className='floor-queue';row.style.top=`${(r.meta.floors-1-f)*100/r.meta.floors}%`;row.innerHTML=`<span class="floor-label">F${f}</span><span class="people"></span>`;q.append(row)}const shafts=el.querySelector('.shafts');for(let k=0;k<r.meta.lifts;k++){const shaft=document.createElement('div');shaft.className='shaft';shaft.innerHTML=`<div class="car" data-lift="${k}" style="--floor:0"><div class="car-top"><b>L${k}</b><span class="indicator">F0 —</span></div><div class="doors"><i class="door"></i><i class="door"></i></div><div class="dots"></div></div>`;shafts.append(shaft)}race.append(el);return el}
const cards={fcfs:building('fcfs','FCFS','Ordered queue'),nearest:building('nearest','Nearest-stop-first','Preemptive')};const frameAt=(r,t)=>r.frames[Math.min(t,r.frames.length-1)]||r.frames[0];
function updateCard(key,t){const r=runs[key],card=cards[key],fr=frameAt(r,t);card.querySelectorAll('.car').forEach((car,k)=>{const l=fr.lifts[k];car.style.setProperty('--floor',l.f);car.style.setProperty('--duration',`${250/speed}ms`);car.classList.toggle('serving',l.a==='S');car.querySelector('.indicator').textContent=`F${l.f} ${l.a==='U'?'▲':l.a==='D'?'▼':'—'}`;car.querySelector('.dots').innerHTML=l.r.map(()=>'<i class="rider"></i>').join('')});card.querySelectorAll('.floor-queue').forEach((row,index)=>{const floor=r.meta.floors-1-index,people=waitAt(r,t).filter(p=>p.from===floor);row.querySelector('.people').innerHTML=people.map(p=>{const w=t-p.arr,cl=w>=15?'red':w>=5?'amber':'';return `<i class="person ${cl}" title="Passenger ${p.id} · waiting ${w} ticks"></i>`}).join('')});const delivered=deliveredAt(r,t),arrived=r.passengers.filter(p=>p.arr<=t),boarded=arrived.filter(p=>p.board>=0&&p.board<=t),avg=boarded.length?boarded.reduce((a,p)=>a+p.board-p.arr,0)/boarded.length:0;const upto=r.frames.slice(0,Math.min(t+1,r.frames.length)),moves=upto.flatMap(x=>x.lifts).filter(x=>x.a==='U'||x.a==='D'),empty=moves.length?100*moves.filter(x=>x.r.length===0).length/moves.length:0,load=upto.length?100*upto.flatMap(x=>x.lifts).reduce((a,x)=>a+x.r.length,0)/(upto.length*r.meta.lifts*r.meta.capacity):0,pre=r.events.filter(e=>e.ev==='PREEMPT'&&e.t<=t).length;card.querySelector('.stats').innerHTML=[['Delivered',`${delivered}/${r.passengers.length}`],['Avg wait',avg.toFixed(1)],['Avg load',load.toFixed(0)+'%'],['Empty moves',empty.toFixed(0)+'%'],['Preempts',pre]].map(x=>`<div class="stat"><b>${x[1]}</b><small>${x[0]}</small></div>`).join('')}
function drawChart(t){const ctx=chart.getContext('2d'),w=chart.width,h=chart.height;ctx.clearRect(0,0,w,h);ctx.strokeStyle=getComputedStyle(document.documentElement).getPropertyValue('--line');for(let y=20;y<h;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}const max=Math.max(...['fcfs','nearest'].flatMap(k=>Array.from({length:maxTick+1},(_,i)=>waitAt(runs[k],i).length)),1);[['fcfs','#c9a75d'],['nearest','#70b88a']].forEach(([k,col])=>{ctx.strokeStyle=col;ctx.lineWidth=3;ctx.beginPath();for(let i=0;i<=Math.min(t,maxTick);i++){const x=i/maxTick*w,y=h-10-waitAt(runs[k],i).length/max*(h-20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()})}
function render(){document.getElementById('tick').textContent=tick;scrub.value=tick;updateCard('fcfs',tick);updateCard('nearest',tick);drawChart(tick);if(tick>=maxTick){playing=false;play.textContent='Play';const f=runs.fcfs.stats,n=runs.nearest.stats,imp=100*(f.avgWait-n.avgWait)/f.avgWait;banner.innerHTML=`<b>Nearest wins the morning rush.</b> Average wait ${n.avgWait.toFixed(1)} vs ${f.avgWait.toFixed(1)} ticks (${imp.toFixed(1)}% shorter), makespan ${n.makespan} vs ${f.makespan}, load ${n.avgLoadPct.toFixed(1)}% vs ${f.avgLoadPct.toFixed(1)}%.`;banner.classList.remove('hidden')}else banner.classList.add('hidden')}
function animate(now){if(playing&&now-last>300/speed){tick=Math.min(maxTick,tick+1);last=now;render()}requestAnimationFrame(animate)}play.onclick=()=>{playing=!playing;play.textContent=playing?'Pause':'Play'};back.onclick=()=>{playing=false;tick=Math.max(0,tick-1);render()};forward.onclick=()=>{playing=false;tick=Math.min(maxTick,tick+1);render()};restart.onclick=()=>{tick=0;playing=true;play.textContent='Pause';render()};scrub.oninput=e=>{playing=false;tick=+e.target.value;render()};speed.onchange=e=>speed=+e.target.value;addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();play.click()}if(e.key==='ArrowLeft')back.click();if(e.key==='ArrowRight')forward.click()});render();requestAnimationFrame(animate)})();
</script></body></html>
